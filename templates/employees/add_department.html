
{% extends "base.html" %}

{% block content %}
{% load static %}

        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-ui-checks-grid" aria-hidden="true"></i></span>
              <div>
                
                <h1 class="h3 mb-1">Add Department</h1>
               
              </div>
            </div>
            
          </div>

          <section class="row g-3">
            <div class="col-12 col-xl-12">
             
<!-- <form class="panel needs-validation" novalidate> -->
    <form method="POST" class="panel needs-validation">

    {% csrf_token %}
    <div class="row g-3">
 
         <!-- department ID -->
        <div class="col-md-6">
            <label class="form-label" for="department">department Code</label>
            <input class="form-control" id="department" name="department_id" type="text" required>
            <div class="invalid-feedback">
                Department ID is required.
            </div>
        </div>

        <!-- Full Name -->
        <div class="col-md-6">
            <label class="form-label" for="employeeName">Department Name</label>
            <input class="form-control" id="department_name" name="department_name" type="text" required>
            <div class="invalid-feedback">
                Full name is required.
            </div>
        </div>
              <!-- Message / Additional Information -->
        <div class="col-md-6">
            <label class="form-label" for="description">
                Description
            </label>
            <textarea class="form-control" name="description" id="description"
                      rows="5"></textarea>
        </div>
        
        <!-- status -->
        <div class="col-md-6">
            <label class="form-label" for="status">Status</label>
            <select class="form-select" id="status" name="status" required>
                <option value="">Choose status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
               
            </select>
            <div class="invalid-feedback">
                Please select a Status.
            </div>
        </div>

   
    </div>

    <!-- Submit Button -->
    <div class="d-flex justify-content-end mt-4">
        <button class="btn btn-primary" type="submit">
            <i class="bi bi-person-plus" aria-hidden="true"></i>
            Add Department
        </button>
    </div>

</form>


            </div>

          </section>
        </div>
      

      {% endblock %}
